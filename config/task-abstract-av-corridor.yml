# yaml-language-server: $schema=../src/DataSchemas/ucl_open_coen_dome_navigation_task.json
# The task file: rig-control copies it at Go with the form's edits (Modality on the form; the
# stage is the Training Stage setting, suggested from the mouse's earlier experiments) and the
# workflow reads the copy (TaskPath). From the editor, the workflow reads this file as it is.
#
# Laid out as av-dome's (Pip, 9 Nov 2026): each trainingStages row says what its stage does; Tom
# Childs' stages 1 to 6 are rows 0 to 5. Not every rule is in the schema: tests\test_task_file.py
# checks this file against the pydantic model (src\ucl_open_coen_dome_navigation\task.py), which
# also says what each field does.
version: 0.0.0-rc1
name: UclOpenCoenDomeNavigation
taskParameters:
  modality: auditory          # auditory (the tone sweep), visual (the grating) or audiovisual
  rngSeed: null               # null = rig-control draws one at Go; each seed used is a RngSeed event in BonsaiData_Async
  # The sweep and its loudness are src\waveforms\sweep.json's, made with the tone files (generate-waveforms).
  backgroundNoiseLevel: 0.5   # background noise RMS as a fraction of the beep RMS; 0 is off
  positionStepCm: 1           # the distance run is rounded to this before it sets the frequency
  trialStructure:
    itiMinSeconds: 2.0        # from the outcome (after any timeout) to the first pip, drinking included:
    itiMaxSeconds: 3.0        # Tom's 2 s then 0 or 1 s, now drawn evenly between (Pip, 9 Nov 2026)
    trackLengthsCm: [80, 100, 120]   # one drawn per trial, times the stage's trackLengthScale
  punishment:
    timeoutSeconds: 2.0       # s after a punished trial
    sound:                    # the error tone, on a punished trial
      enabled: true
      path: waveforms\error_tone.wav
      gain: 1.0
  truncation:                 # on a stage's truncated trials
    sweepFractions: [0.4, 0.6]
  optogenetics:               # Zapit; the laser runs from the trigger to the outcome (or laserMaxSeconds), laser-off trials laser off
    useZapit: false
    zapitConfigPath: ''   # the Zapit conditions file loaded in Zapit
    laserPowerMw: null        # mW on laser-on trials, every condition; required with optogenetics on
    laserOnProbability: 0.4   # laser-on trials after trialsBeforeLaser; the rest are 0 mW; each trial's condition drawn at random
    laserMaxSeconds: 12.5     # s from the trigger; a cap: at least the longest timeLimitSeconds + laserToStimulusSeconds + 0.25, the laser stops at the outcome
    laserToStimulusSeconds: 0.1   # s, signed, whole 0.05 s beeps, at most 0.2: the trigger before the first pip (negative: after); the first pip comes max(this, 0) after the trial's start in every experiment
    triggerHoldSeconds: 1.0   # s the trigger line and masking light stay on after the outcome (at least 0.5, the longest ramp-down; the next trial is armed once it falls)
    trialsBeforeLaser: 20     # no laser-on trial among the first this many
  # Rows by the Training Stage setting (a setting past the end stops the workflow at Go). The reward zones are
  # Tom's: centred on 18 kHz in log space, a 6 kHz window from stage 2 (task.py's old derivation).
  trainingStages:
    - label: Stage 0 (Tom's 1)   # rewarded on reaching the zone, no lick; short tracks; the frequency drifts too
      rewardFloorHz: 18000
      rewardCeilingHz: 25000
      rewardSizeUl: 2.0
      lickToReward: false
      wrongLickLimit: 0
      punishWrongZone: false
      lickQuietSeconds: 0
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      timeLimitSeconds: null
      trackEndEndsTrial: false
      trackLengthScale: 0.125
      frequencyDrift: true
      truncatedTrialFraction: 0.0
    - label: Stage 1 (Tom's 2)   # as stage 0, no drift
      rewardFloorHz: 18000
      rewardCeilingHz: 25000
      rewardSizeUl: 2.0
      lickToReward: false
      wrongLickLimit: 0
      punishWrongZone: false
      lickQuietSeconds: 0
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      timeLimitSeconds: null
      trackEndEndsTrial: false
      trackLengthScale: 0.125
      frequencyDrift: false
      truncatedTrialFraction: 0.0
    - label: Stage 2 (Tom's 3)   # a lick anywhere above the floor; full tracks; the end of the track ends the trial
      rewardFloorHz: 15248
      rewardCeilingHz: 25000
      rewardSizeUl: 2.0
      lickToReward: true
      wrongLickLimit: 0
      punishWrongZone: false
      lickQuietSeconds: 0
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      timeLimitSeconds: null
      trackEndEndsTrial: true
      trackLengthScale: 1.0
      frequencyDrift: false
      truncatedTrialFraction: 0.0
    - label: Stage 3 (Tom's 4)   # the ceiling comes in; wrong licks and slowness punished
      rewardFloorHz: 15248
      rewardCeilingHz: 21248
      rewardSizeUl: 2.0
      lickToReward: true
      wrongLickLimit: 8
      punishWrongZone: true
      lickQuietSeconds: 1.0       # s without licks before Go, from the interval's start
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      timeLimitSeconds: 12.0  # from the first tone pip
      trackEndEndsTrial: true
      trackLengthScale: 1.0
      frequencyDrift: false
      truncatedTrialFraction: 0.0
    - label: Stage 4 (Tom's 5)   # fewer wrong licks allowed
      rewardFloorHz: 15248
      rewardCeilingHz: 21248
      rewardSizeUl: 2.0
      lickToReward: true
      wrongLickLimit: 5
      punishWrongZone: true
      lickQuietSeconds: 1.0       # s without licks before Go, from the interval's start
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      timeLimitSeconds: 12.0  # from the first tone pip
      trackEndEndsTrial: true
      trackLengthScale: 1.0
      frequencyDrift: false
      truncatedTrialFraction: 0.0
    - label: Stage 5 (Tom's 6)   # stage 4 with 16% truncated trials; only ever chosen by hand
      rewardFloorHz: 15248
      rewardCeilingHz: 21248
      rewardSizeUl: 2.0
      lickToReward: true
      wrongLickLimit: 5
      punishWrongZone: true
      lickQuietSeconds: 1.0       # s without licks before Go, from the interval's start
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      timeLimitSeconds: 12.0  # from the first tone pip
      trackEndEndsTrial: true
      trackLengthScale: 1.0
      frequencyDrift: false
      truncatedTrialFraction: 0.16
