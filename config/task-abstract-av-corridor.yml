# yaml-language-server: $schema=../src/DataSchemas/ucl_open_coen_dome_navigation_task.json
# The task file: rig-control copies it at Go with the form's edits (Modality and Shaping Stage on
# the form; the stage is suggested from the mouse's earlier experiments) and the workflow reads the
# copy (TaskPath). From the editor, the workflow reads this file as it is.
#
# Not every rule is in the schema: tests\test_task_file.py checks this file against the pydantic
# model (src\ucl_open_coen_dome_navigation\task.py), which also says what each field does.
version: 0.0.0-rc1
name: UclOpenCoenDomeNavigation
taskParameters:
  modality: A                 # A (auditory), V (visual) or AV
  shapingStage: 1             # 1-6; 6 is stage 5 with truncated trials, only ever chosen by hand
  # The sweep and its loudness. src\waveforms is made for these four: change them only together
  # with `uv run generate-waveforms` and a commit, or the workflow stops at Go.
  startFreq: 2000             # Hz
  endFreq: 25000              # Hz
  nFreqBins: 100
  amplitude: 0.05             # a tone pip peaks at amplitude squared
  centerFreq: 18000           # Hz, the middle of every reward window
  rewardWindowSize: 6000      # Hz
  # The reward zone per stage, as task.py derives it from centerFreq, rewardWindowSize and endFreq
  # (the workflow does not derive it): change them together, and tests\test_task_file.py checks.
  thresholdFrequencies:
    stage1: { floor: 18000, ceiling: 25000 }   # rewarded on reaching the zone, no lick needed
    stage2: { floor: 18000, ceiling: 25000 }
    stage3: { floor: 15248, ceiling: 25000 }   # a lick anywhere above the floor
    stage4: { floor: 15248, ceiling: 21248 }   # the ceiling comes in; wrong licks punished
    stage5: { floor: 15248, ceiling: 21248 }   # stage 6 uses stage 5's
  rewardSizeUl: 3.0           # ul per reward on the left spout
  # The wheel diameter distances are worked out at; null takes rig.yml's (170 mm on every corridor
  # rig). 75 is what Tom's workflow used, so tracks take the wheel turns the mice trained on.
  wheelDiameterMm: 75.0
  punishment:
    timeoutSec: 2
    stage4PunishedLick: 8
    stage5PunishedLick: 5
  truncation:                 # stage 6 only
    fraction: 0.16
    points: [0.4, 0.6]
  engagement:                 # unused: Tom's report of engaged trials, never the stage rule
    rollWindow: 25
    rollThreshold: 0.5
    minEpoch: 10
  optogenetics:               # Zapit; continuous stimulus from beep 0 to the outcome (or stimDuration), sham trials laser off
    enabled: false
    zapitConfigPath: ''       # the Zapit stimulus config loaded in Zapit
    stimProbability: 0.4      # laser-on trials after the warmup, shared by all conditions; the rest are sham
    stimDelay: 0.0            # av-dome's; must be 0 (Zapit ignores it for a continuous stimulus)
    stimDuration: 12.5        # s; a cap: at least 12 + leadTime + 0.25, the laser stops at the outcome
    leadTime: 0.1             # s the stimulus runs before the first tone pip (multiple of 0.05)
    excludeRepeats: true      # av-dome's; this task has no repeat trials
    pseudorandomSelection: true
    warmupTrials: 20          # sham trials at the start
  backgroundNoiseLevel: 0.5   # background noise RMS as a fraction of the beep RMS; 0 is off
  quantizeBinSize: 1          # Hz
