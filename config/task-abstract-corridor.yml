# yaml-language-server: $schema=../src/DataSchemas/ucl_open_coen_dome_navigation_task.json
# The task file: app-rig-control copies it at launch and again at Go with the form's edits, and the workflow reads the
# copy (TaskPath) at Go. From the editor, the workflow reads this file as it is.
#
# The stage is a stage of the lab's Mouse Curriculum
# (K:\config\curricula\coen-dome-navigation\task-abstract-corridor.conditions.yml, edited on app-rig-control's Mouse
# Curriculum page): app-rig-control writes that stage's values over the values below at launch and fills curriculum.
# The values here are the defaults (stage 0's). Not every rule is in the schema: tests\test_task_schema.py checks
# this file against the pydantic model (src\ucl_open_coen_dome_navigation\task.py), which also says what each field does.
taskParameters:
  rngSeed: null               # null = the workflow draws one at Go; each seed used is a RngSeed event in WorkflowData_Events
  # The curriculum stage these values came from, the task file's only record of the stage: app-rig-control fills it at launch
  # (id, code, version, path, label, sha256), and Go refuses a task whose curriculum is empty or malformed. Empty here.
  curriculum:
  # The trial mix, one whole value: each condition's relative chance and what its trials show, its set over the task's
  # values (any field but x-session-fields': visualStimulus.contrasts, 0 no grating; auditoryStimulus.levelDbfs, mute no
  # tone; ...), every list field one entry per combination (a row of Settings_Combinations, logged trialCombinationId), its
  # pairs picking listed values together; its trialType is derived from its values at Go (x-trial-types: visual,
  # auditory, audiovisualCoherent below). A curriculum stage's conditions replace it; Setup edits
  # only the weights.
  trialConditions:
    - { weight: 0, set: { auditoryStimulus.levelDbfs: mute } }
    - { weight: 1, set: { visualStimulus.contrasts: [0] } }
    - { weight: 0, set: {} }
  trialStructure:
    itiMinSeconds: 2.0        # from the outcome (after any timeout) to the first pip, drinking included:
    itiMaxSeconds: 3.0        # Tom's 2 s then 0 or 1 s, now drawn evenly between
    responseWindowSeconds: null   # s from the first tone pip, then noResponse; null: the window never closes
    lickQuietSeconds: 0       # s without licks before the trial start, from the interval's start; 0 off
    wheelQuietSeconds: 0      # s with the wheel still before the trial start, from the interval's start; 0 off
    wheelQuietCm: 0           # cm of wheel travel (forward and back added) allowed in the last wheelQuietSeconds; 0 none
  visualStimulus:             # the grating: its contrast, and its spatial frequency from the track's start to its end on a log scale
    contrasts: [1.0]          # grating contrasts (BonVision's Contrast), one drawn per trial; 0 no grating
    spatialFrequencyStartCpd: 0.03
    spatialFrequencyEndCpd: 0.3
  # Every sound plays at a level in dBFS RMS of the sound as stored, before equalisation (lib-open-rigs OpenRigs.Audio
  # SoundLevel); mute plays nothing. Each is condition-level; the background noise is the lab's constant, -60. The sweep is src\sounds\sweep.json's, made with the tone files (generate-waveforms).
  auditoryStimulus:           # the tone sweep's pips
    levelDbfs: -55            # dBFS RMS; mute: no tone
    elevationDeg: 0           # the elevation the nearest speaker is found at
    initialAzimuthsDeg: [all]   # one picked per trial: all, every rig.yml speaker; a number, rig.yml's speaker nearest that azimuth
  reward:
    sizeUl: 3.0               # ul on the left spout's valve, planned from its calibration
    largeMultiplier: 2        # x sizeUl on a large-reward trial, above 1
    largeProbability: 0       # large-reward trials; 0: none
  autoRewardProbability: 1.0   # every trial rewarded on reaching the floor, no lick needed
  penalty:
    timeoutSeconds: 2.0       # s after a penalised trial
    sound:                    # the lab's penalty sound (OpenRigs.Audio), on a penalised trial
      levelDbfs: -45          # dBFS RMS, on rig.yml's penaltySoundChannel alone; mute: none
  rewardTone:                 # on a rewarded trial, every speaker
    levelDbfs: -55            # dBFS RMS; mute: none
  optogenetics:               # Zapit; the laser runs from the trigger to the outcome (or its cap, derived at Go), laser-off trials laser off
    enabled: false
    zapitConditionsPath: ''   # the Zapit conditions file loaded in Zapit
    laserPowerMw: null        # mW on laser-on trials, every condition; required with optogenetics on
    laserOnProbability: 0.4   # laser-on trials after trialsBeforeLaser; the rest are 0 mW; each trial's condition drawn at random
    laserToStimulusSeconds: 0.1   # s, signed, whole 0.05 s steps, at most 0.2: the trigger before the first pip (negative: after); the first pip comes max(this, 0) after the trial's start in every experiment
    trialsBeforeLaser: 20     # no laser-on trial among the first this many
  track:
    lengthsCm: [80, 100, 120]   # track cm, one drawn per trial; the mouse runs track cm / wheelGain of wheel
    wheelGain: 8.0            # track cm per wheel cm
    autoProgressPerSecond: 0.04   # of the track per second on its own: the whole track in 25 s
  # What a training stage changes; the reward zones are Tom's: centred on 18 kHz in log space, a 6 kHz window from
  # the Lick to Report stage (task.py's old derivation), and at most the track's top, 24 kHz.
  rewardZoneMinHz: 18000
  rewardZoneMaxHz: 24000
  wrongLickLimit: 0           # licks outside the zone that end the trial; 0: never
  stimulusOff:                # a condition's stimulus-off trials: stimuli none, auditory, visual or both
    stimuli: none
    trackFractions: [1.0]        # of the trial's track length, one drawn per trial; 1.0: the track's end, never (a stimulus-off condition sets its own)
