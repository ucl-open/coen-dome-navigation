# yaml-language-server: $schema=../src/DataSchemas/ucl_open_coen_dome_navigation_task.json
# The task file: rig-control copies it at launch and again at Go with the form's edits (the stage is
# the Training Stage setting, suggested from the mouse's earlier experiments),
# and the workflow reads the copy (TaskPath) at Start for the background noise and at Go for the rest.
# From the editor, the workflow reads this file as it is.
#
# Each trainingStages row says what its stage does. Not every rule is in the schema: tests\test_task_schema.py
# checks this file against the pydantic model (src\ucl_open_coen_dome_navigation\task.py), which
# also says what each field does.
taskParameters:
  rngSeed: null               # null = the workflow draws one at Go; each seed used is a RngSeed event in WorkflowData_Events
  # Relative chances of what a trial shows, per mouse (Setup): the grating, the tone sweep or both; conflict and neutral
  # trials are not defined here yet. A trainingStages row may set its own trialWeights for that stage (none does).
  trialWeights: { visual: 0, auditory: 1, audiovisualCoherent: 0, audiovisualConflict: 0, neutral: 0 }
  # The sweep is src\sounds\sweep.json's, made with the tone files (generate-waveforms); each sound's level is here,
  # in dBFS RMS of the sound as stored, before equalisation: the levels mice have always had (Tom Childs' pips were
  # scaled by 0.05 twice, hence quiet; the lab's defaults are lib-open-rigs' OpenRigs.Audio SoundLevel).
  auditoryStimulus:           # the tone sweep's pips
    levelDbfs: -58.1
  rewardTone:
    levelDbfs: -55.1
  backgroundNoise:            # white noise on every speaker, unequalised, faded in at Ready at the level launched
    enabled: true
    levelDbfs: -64.1
  visualStimulus:             # the grating's spatial frequency, from the track's start to its end on a log scale
    spatialFrequencyStartCpd: 0.03
    spatialFrequencyEndCpd: 0.3
  positionStepCm: 1           # the distance run is rounded to this before it sets the frequency
  driftSeconds: 25.0          # a frequencyDrift stage's tone and grating reach the sweep's end on their own after this long from the trial start
  trialStructure:
    itiMinSeconds: 2.0        # from the outcome (after any timeout) to the first pip, drinking included:
    itiMaxSeconds: 3.0        # Tom's 2 s then 0 or 1 s, now drawn evenly between
    trackLengthsCm: [80, 100, 120]   # one drawn per trial, times the stage's trackLengthScale
  penalty:
    timeoutSeconds: 2.0       # s after a penalised trial
    sound:                    # the lab's penalty sound (OpenRigs.Audio), on a penalised trial
      enabled: true
      levelDbfs: -44.6        # dBFS RMS, on rig.yml's penaltySoundChannel alone
  truncation:                 # on a stage's truncated trials
    sweepFractions: [0.4, 0.6]
  optogenetics:               # Zapit; the laser runs from the trigger to the outcome (or laserMaxSeconds), laser-off trials laser off
    enabled: false
    zapitConditionsPath: ''   # the Zapit conditions file loaded in Zapit
    laserPowerMw: null        # mW on laser-on trials, every condition; required with optogenetics on
    laserOnProbability: 0.4   # laser-on trials after trialsBeforeLaser; the rest are 0 mW; each trial's condition drawn at random
    laserMaxSeconds: 12.5     # s from the trigger; a cap: at least the longest responseWindowSeconds + laserToStimulusSeconds + 0.25, the laser stops at the outcome
    laserToStimulusSeconds: 0.1   # s, signed, whole 0.05 s steps, at most 0.2: the trigger before the first pip (negative: after); the first pip comes max(this, 0) after the trial's start in every experiment
    triggerHoldSeconds: 1.0   # s the trigger line and masking light stay on after the outcome (at least 0.5, the longest ramp-down; the next trial is armed once it falls)
    trialsBeforeLaser: 20     # no laser-on trial among the first this many
  # Rows by the Training Stage setting (a setting past the end stops the workflow at Go). The reward zones are
  # Tom's: centred on 18 kHz in log space, a 6 kHz window from stage 2 (task.py's old derivation).
  trainingStages:
    # Stage 0: rewarded on reaching the zone, no lick; short tracks; the frequency drifts too
    - label: Zone Reward, Drift
      rewardFloorHz: 18000
      rewardCeilingHz: 25000
      rewardSizeUl: 3.0
      autoRewardProbability: 1.0   # every trial rewarded on reaching the floor, no lick needed
      wrongLickLimit: 0
      lickQuietSeconds: 0
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      responseWindowSeconds: null   # the window never closes
      trackLengthScale: 0.125
      frequencyDrift: true
      truncatedTrialFraction: 0.0
    # Stage 1: as stage 0, no drift
    - label: Zone Reward
      rewardFloorHz: 18000
      rewardCeilingHz: 25000
      rewardSizeUl: 3.0
      autoRewardProbability: 1.0   # every trial rewarded on reaching the floor, no lick needed
      wrongLickLimit: 0
      lickQuietSeconds: 0
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      responseWindowSeconds: null   # the window never closes
      trackLengthScale: 0.125
      frequencyDrift: false
      truncatedTrialFraction: 0.0
    # Stage 2: a lick anywhere above the floor; full tracks
    - label: Lick to Report
      rewardFloorHz: 15248
      rewardCeilingHz: 25000
      rewardSizeUl: 3.0
      autoRewardProbability: 0.0
      wrongLickLimit: 0
      lickQuietSeconds: 0
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      responseWindowSeconds: null   # the window never closes
      trackLengthScale: 1.0
      frequencyDrift: false
      truncatedTrialFraction: 0.0
    # Stage 3: the ceiling comes in; wrong licks and slowness penalised
    - label: Ceiling In
      rewardFloorHz: 15248
      rewardCeilingHz: 21248
      rewardSizeUl: 3.0
      autoRewardProbability: 0.0
      wrongLickLimit: 8
      lickQuietSeconds: 1.0       # s without licks before the trial start, from the interval's start
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      responseWindowSeconds: 12.0  # s from the first tone pip; then NoResponse
      trackLengthScale: 1.0
      frequencyDrift: false
      truncatedTrialFraction: 0.0
    # Stage 4: fewer wrong licks allowed
    - label: Fewer Wrong Licks
      rewardFloorHz: 15248
      rewardCeilingHz: 21248
      rewardSizeUl: 3.0
      autoRewardProbability: 0.0
      wrongLickLimit: 5
      lickQuietSeconds: 1.0       # s without licks before the trial start, from the interval's start
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      responseWindowSeconds: 12.0  # s from the first tone pip; then NoResponse
      trackLengthScale: 1.0
      frequencyDrift: false
      truncatedTrialFraction: 0.0
    - label: Truncated   # stage 4 with 16% truncated trials; only ever chosen by hand
      rewardFloorHz: 15248
      rewardCeilingHz: 21248
      rewardSizeUl: 3.0
      autoRewardProbability: 0.0
      wrongLickLimit: 5
      lickQuietSeconds: 1.0       # s without licks before the trial start, from the interval's start
      wheelQuietSeconds: 0
      wheelQuietCm: 0
      responseWindowSeconds: 12.0  # s from the first tone pip; then NoResponse
      trackLengthScale: 1.0
      frequencyDrift: false
      truncatedTrialFraction: 0.16
