# What each BonsaiData_Trial column this workflow writes means (the TrialRow group builds the row
# when the trial's outcome is known, TrialOutcome). ExperimentManifest (TrialColumns) copies this file into every
# experiment's manifest.json at Start, so each experiment carries the meaning of its own trial log.
#
# Each column: type (int, double, bool or string), and where they apply values, unit, formerly
# (the name in Tom Childs' auditory-vr-corridor TrialLog) and description. The names and types must
# also be on the lab's list (K:\config\data-dictionary.json, edited from rig-setup's Repos page):
# rig-control checks both before it launches the workflow.
#
# Naming: camelCase; a Harp time ends in Time and is in seconds; a quantity ends in its unit.

Seconds:
  type: double
  unit: s
  formerly: [HarpTime]
  description: Harp time the row was built, when the outcome was known - after the reward tone on a reward, after the error tone and timeout on a punishment, at once otherwise. Tom Childs' TrialLog was stamped 2 s later.
trialNumber:
  type: int
  formerly: [Trial]
  description: The trial's number in the experiment, from 1.
trialType:
  type: string
  values: [auditory, visual, audiovisual]
  formerly: [Modality]
  description: What the trial showed, in words, as av-dome's trialType - auditory (the tone sweep), visual (the grating) or both; the task file's modality, A, V or AV.
trainingStage:
  type: int
  formerly: [ShapingStage]
  description: The training stage the trial ran at, 1 to 6 (the task file's shapingStage).
outcome:
  type: string
  values: [Correct, Incorrect, NoResponse]
  formerly: [WasRewarded]
  description: The trial's result, in av-dome's values - Correct when rewarded, Incorrect at the wrong-lick limit, NoResponse at the time limit or the end of the track (endReason says which). rig-control's performance is Correct over all trials, Tom Childs' success rate.
endReason:
  type: string
  values: [FreqReached, CorrectLick, WrongLickLimit, Timeout, EndOfTrack]
  formerly: [EndReason]
  description: Why the trial ended - the reward frequency reached (stages 1-2), a lick in the reward zone, too many wrong licks, the trial's time limit, or the end of the track.
punished:
  type: bool
  formerly: [WasPunished]
  description: True when the error tone and timeout were given.
lickCount:
  type: int
  formerly: [LickCount]
  description: Licks on the left spout from the trial's start to the outcome (Seconds). Tom Childs' LickCount was read 2 s later, so it also counted the licks while the mouse drank, and a stage 1-2 trial rewarded without a lick now reads 0 (his engagement label used LickCount > 0). Every lick is in the LicketySplit-Left Harp log.
trackLengthCm:
  type: double
  unit: cm
  formerly: [TrackLength]
  description: The trial's track length, drawn per trial (shorter in stages 1 and 2). Distances are at the task file's wheelDiameterMm.
endPositionCm:
  type: double
  unit: cm
  formerly: [TrialEndPosCm]
  description: Distance run in the trial when the row was built (Seconds). Tom Childs' TrialEndPosCm was read 2 s later, so it included running after the outcome.
rewardFloorHz:
  type: double
  unit: Hz
  formerly: [RewAudFreqFloor]
  description: The reward zone's lower frequency.
rewardCeilingHz:
  type: double
  unit: Hz
  formerly: [RewAudFreqCeil]
  description: The reward zone's upper frequency.
audioEndFrequencyHz:
  type: double
  unit: Hz
  formerly: [TrialEndAudFreq]
  description: The sweep's frequency when the trial ended.
visualEndSpatialFrequencyCpd:
  type: double
  unit: cycles/deg
  formerly: [TrialEndVisFreq]
  description: The grating's spatial frequency when the trial ended.
audioAmplitude:
  type: double
  formerly: [AudAmplitude]
  description: The tone scale the trial played at - the task's amplitude, 0 when the modality has no sound.
truncationFraction:
  type: double
  formerly: [TruncationPoint]
  description: Where the cue switched off, as a fraction of the sweep; 1 on an untruncated trial.
itiStartTime:
  type: double
  unit: s
  formerly: [ITIStartHarp]
  description: Harp time the inter-trial interval before this trial began.
itiSeconds:
  type: double
  unit: s
  formerly: [ITIDrawnSec]
  description: The inter-trial interval drawn for this trial.
trialStartTime:
  type: double
  unit: s
  formerly: [TrialStartHarp]
  description: Harp time the trial started (position zero).
trialStartWheelCm:
  type: double
  unit: cm
  formerly: [TrialStartWheelDistanceCm]
  description: Wheel distance since the start of the experiment when the trial started.
stimulusOnsetTime:
  type: double
  unit: s
  formerly: [CueOnsetHarp]
  description: Harp time the workflow commanded the stimulus on - the trial's first tone pip and grating frame (beep 1, 50 ms after the trial's start at beep 0), as Tom Childs' CueOnsetHarp. In an optogenetics experiment the laser trigger is at beep 0 and the laser stimDelay after it. The physical onset is in the hardware logs.
outcomeTime:
  type: double
  unit: s
  formerly: [OutcomeHarp]
  description: Harp time of the outcome (reward, punishment or end).
rewardSizeUl:
  type: double
  unit: ul
  description: Microlitres a reward on this trial gives (the task file's rewardSizeUl). What was delivered is RewardDelivered in BonsaiData_Async.
optoStimulated:
  type: bool
  description: True when this trial had optogenetic stimulation.
optoCondition:
  type: int
  description: The Zapit condition stimulated, 0 when none.
