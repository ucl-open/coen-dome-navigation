# What each WorkflowData_Trials column this workflow writes means. ExperimentManifest (TrialColumns) copies
# this file into every experiment's manifest.json at Start, so each experiment carries the meaning of its
# own trial log; open_rigs.trial_log reads it from there.
#
# Each column: type (int, double, bool or string), and where they apply values (the strings it may hold),
# unit, description (what it is), note (this task's detail) and history (what recorded data held before). The names and types must also be in the lab's
# Data Dictionary (K:\config\data-dictionary.json, edited on app-rig-control's Lab Names page): app-rig-control checks
# both before it launches the workflow.
#
# Naming: camelCase; a Harp time ends in Time and is in seconds; a duration or other quantity ends in its
# unit (itiSeconds, rewardOfferedUl); never a stored latency.
#
# The first 18 columns, harpTime to laserTriggerTime, are the lab's shared block, its core with the optogenetics and quietWait blocks,
# defined once in lib-open-rigs open_rigs.rigs.trials: coen-dome-decision-making and
# coen-dome-navigation list them in this order with these types, units and descriptions, word for word
# (tests/test_trial_columns.py holds both), so one analysis reads both tasks.
# trialType and outcome are described per task, and which trials are rewarded and penalised in those columns' notes. This task's own columns follow.
#
# Only what changes from trial to trial: the task file's values fixed for the
# experiment (the stage's values and curriculum, the sound levels) are in Settings\Settings_Task_*.json, whose curriculum (code, version, path)
# is the stage, and the metric curriculumStage is its code-version; no column sums the Harp logs, and none repeats another but outcomeTime, which names harpTime's
# moment so that the shared block names every moment of a trial.

harpTime:
  type: double
  unit: s
  description: Harp time the row was complete, when the outcome was known (outcomeTime). The lab's time column, first in every log (lib-open-rigs specs/logging.md, section 4); a trial's moments are read from their own columns.
  history: Tom Childs' TrialLog was stamped 2 s after the outcome.
trialNumber:
  type: int
  description: The trial's number in the experiment, from 1.
trialType:
  type: string
  values: [visual, auditory, audiovisualCoherent, neutral]
  description: The label of the trial's condition (trialCondition), in coen-dome-decision-making's words - a name for the rows and analysis groups that drives nothing; what the trial showed is its own columns (visualContrast, auditoryAmplitude). By default it is derived from the condition's settings - visual (the grating alone), auditory (the tone sweep alone), audiovisualCoherent (both) or neutral (neither) - but a curriculum may choose another.
  history: Before the trial-type split (Nov 2026) the condition's label drove what the trial showed (visual, auditory, audiovisualCoherent), at contrast 1 and the pips' one level, so the label alone says what those trials showed.
outcome:
  type: string
  values: [Correct, Incorrect, NoResponse]
  description: The trial's result, in av-dome's values - Correct when rewarded, Incorrect at the wrong-lick limit, NoResponse at the end of the response window or of the track (outcomeReason says which). rig-control's Performance is Correct over Correct and Incorrect (NoResponse left out, its response rate shown beside it); Tom Childs' success rate was Correct over all trials.
itiStartTime:
  type: double
  unit: s
  description: "Harp time the inter-trial interval before this trial began: the last trial's outcomeTime plus its penaltyTimeoutSeconds, exactly; on trial 1 the first Harp clock tick once the trials started."
  note: Trials start 0.5 s after the experiment folder exists and the tones are loaded.
itiSeconds:
  type: double
  unit: s
  description: "The inter-trial interval drawn for this trial (every trial draws its own), uniformly between trialStructure.itiMinSeconds and itiMaxSeconds: from itiStartTime to this trial's stimulus with a quiet mouse, the time to drink included. A task's quiet waits add quietWaitSeconds, so the stimulus was due at itiStartTime + itiSeconds + quietWaitSeconds (stimulusOnsetTime)."
quietWaitSeconds:
  type: double
  unit: s
  description: How long the quiet waits (lickQuietSeconds, wheelQuietSeconds and wheelQuietCm; OpenRigs.Core QuietWait) held this trial's start past the end of its interval less the lead; 0 with the waits off or a quiet mouse.
trialStartTime:
  type: double
  unit: s
  description: "Harp time the trial started: the end of its interval less the lead, max(laserToStimulusSeconds, 0) in the task file (Settings_Task) and 0 for a task file with no optogenetics block, plus quietWaitSeconds where the task has quiet waits."
  note: Step 0, the track's position zero.
stimulusOnsetTime:
  type: double
  unit: s
  description: "Harp time the workflow commanded the stimulus on, NaN if it never was: the first tick of the 1 ms Harp clock at or after trialStartTime plus the lead, in every experiment. The physical onset is in the hardware logs."
  note: The trial's first tone pip and grating frame, as Tom Childs' CueOnsetHarp.
outcomeTime:
  type: double
  unit: s
  description: Harp time the workflow knew the outcome, the same time as harpTime, as its own column so that every moment of a trial is named; the reward, the penalty sound and the timeout are timed from it. On a lick it is the Harp clock's latest tick when the workflow saw the lick, a few ms after it; each lick's own Harp time is in the lick detectors' logs.
  note: Why the trial ended is outcomeReason - a lick in the reward zone, the wrong-lick limit, the end of the response window, the end of the track or the reward frequency reached.
rewardOfferedUl:
  type: double
  unit: ul
  description: "Microlitres a reward on this trial gives, on every trial whether or not it was rewarded: the size the task drew for it (the task file's rewardSizeUl, or a larger reward where the task has one); 0 on a trial that offers none. rewarded says whether it was given; what was delivered is RewardDelivered in WorkflowData_Events."
  note: The trial's condition's reward.rewardSizeUl (a condition field since 18 Nov 2026; the task file's before), on every trial.
rewarded:
  type: bool
  description: "True when the trial's outcome delivered its reward (rewardOfferedUl, at outcomeTime): the value the workflow's reward command is made from. Which outcomes are rewarded is the task's (its note)."
  note: A trial that ends on a lick in the reward zone or with the zone reached (outcomeReason CorrectLick or FrequencyReached, outcome Correct), rewarded at the left spout.
penaltySoundOn:
  type: bool
  description: "True when the trial was penalised and the task's penalty sound is enabled."
penaltyTimeoutSeconds:
  type: double
  unit: s
  description: "The timeout after this trial: the task's penalty.timeoutSeconds when the trial was penalised, else 0. The next interval starts after it (itiStartTime)."
penalised:
  type: bool
  description: "True when the trial was penalised: the task's penalty timeout (penaltyTimeoutSeconds) and, with its penalty.sound enabled, the penalty sound (penaltySoundOn) followed its outcome. Which outcomes are penalised is the task's (its note)."
  note: A trial that runs out of time or track with the outcome frequency in the reward zone, or ends outside the zone (TrialLogic.cs TrialRules.End).
laserCondition:
  type: int
  description: "The Zapit condition sent to Zapit this trial (its conditions file's number, from 1), laser on or off: every trial of an optogenetics experiment has one, so laser on is laserPowerMw > 0, not laserCondition > 0. 0 without optogenetics."
laserPowerMw:
  type: double
  unit: mW
  description: Laser power sent to Zapit for this trial (the task's optogenetics.laserPowerMw), as commanded, not measured. 0 on laser-off trials, without optogenetics, and on a trial answered before its trigger.
laserTriggerTime:
  type: double
  unit: s
  description: "Harp time the workflow raised the Zapit trigger line (the laser, or at 0 mW the galvos and masking light alone): the first tick of the 1 ms Harp clock at or after laserToStimulusSeconds before the stimulus was due. NaN without optogenetics and on a trial that ended before its trigger, so a laser-off trial (a time, laserPowerMw 0) and one answered first (NaN) differ."
trialCondition:
  type: int
  description: The 0-based index of the trial's condition in trialConditions of the task file as run (Settings_Task), which gives its label, weight and condition-level values (set); before 18 Nov 2026 the label was named type. A repeat keeps the condition of the trial it repeats.
trialCombination:
  type: int
  description: The 0-based index of the trial's combination within its condition (trialCondition) - every list pick it drew, each list cell of the condition's set and each list field (contrasts, the initial azimuths, the track lengths and the stimulus-off fractions, the set's or the task's) one entry, pairs zipped, combined by path with the first pick changing fastest (task.py condition_combinations); with trialCondition and the task file as run it gives every value the trial was drawn from.
  history: Added 18 Nov 2026; before it, the track length and stimulus-off fraction were drawn per trial apart from the condition.
outcomeReason:
  type: string
  values: [FrequencyReached, CorrectLick, WrongLickLimit, ResponseWindowEnd, TrackEnd]
  description: Why the trial ended - the reward frequency reached (on an auto-reward trial, drawn with the trial's condition's autoRewardProbability, every trial of stages 0 and 1), a lick in the reward zone, too many wrong licks, the end of the stage's response window (responseWindowSeconds after the first pip), or the end of the track.
trackLengthCm:
  type: double
  unit: cm
  description: Wheel distance from the trial start to the track's end - the trial's track length (one of trialStructure.trackLengthsCm, drawn per trial) divided by wheelGain. Every position column is in these wheel cm. Distances are at rig.yml's wheelDiameterMm (75 mm on every dome).
wheelGain:
  type: double
  description: The stage's wheelGain - track cm per wheel cm, so the track length drawn is trackLengthCm x wheelGain. The tone and grating are set from the track's progress, wheel cm x wheelGain / track length plus the stage's autoProgressPerSecond x seconds since the trial start (in Settings_Task's taskParameters).
outcomePositionCm:
  type: double
  unit: cm
  description: Wheel distance run along the track at the outcome (outcomeTime), behind the start never counted and capped at the track's length. Tom Childs' TrialEndPosCm was read 2 s later, so it included running after the outcome.
outcomeAuditoryFrequencyHz:
  type: double
  unit: Hz
  description: The tone sweep's frequency at the outcome (outcomeTime).
outcomeVisualSpatialFrequencyCpd:
  type: double
  unit: cycles/deg
  description: The grating's spatial frequency at the outcome (outcomeTime).
auditoryOffPositionCm:
  type: double
  unit: cm
  description: Position along the track where the tone switched off on a stimulus-off trial (drawn with the stage's stimulusOffProbability, at one of stimulusOff.trackFractions of trackLengthCm, with auditory in stimulusOff.stimuli); NaN when it never did.
visualOffPositionCm:
  type: double
  unit: cm
  description: Position along the track where the grating switched off on a stimulus-off trial (drawn with the stage's stimulusOffProbability, at one of stimulusOff.trackFractions of trackLengthCm, with visual in stimulusOff.stimuli); NaN when it never did.
autoRewarded:
  type: bool
  description: True when an auto-reward trial (drawn with the trial's condition's autoRewardProbability) was rewarded, on reaching the reward zone's floor with no lick needed (outcomeReason FrequencyReached).
visualContrast:
  type: double
  description: Grating contrast as BonVision's Contrast, 1 full contrast; 0 when no grating showed (drawn from the trial's condition's contrasts).
  history: Added in the trial-type split (Nov 2026); before it a trial showing the grating showed it at contrast 1.
auditoryAmplitude:
  type: double
  description: The tone's amplitude, the task's auditoryStimulus.amplitude for the trial's condition - the scale of the pips' samples as stored (1 the files as stored, -58.1 dBFS RMS before equalisation); 0 when no tone played.
  history: Added in the trial-type split (Nov 2026); before it every tone played at auditoryStimulus.levelDbfs -58.1, the same loudness as amplitude 1.
  note: The trial's amplitude even where a stimulus-off trial switched the tone off part way (auditoryOffPositionCm); each pip's own amplitude, 0 once switched off, is WorkflowData_StimulusState's auditoryAmplitude.
auditoryAzimuthDeg:
  type: double
  unit: deg
  description: Azimuth of the speaker that played, rig.yml's nearest to the location drawn; NaN when none played.
  note: The pips' one speaker, rig.yml's nearest (at elevation 0) to the azimuth picked from the condition's auditoryStimulus.initialAzimuthsDeg; NaN with auditoryAmplitude above 0 when the pick was all, every speaker at once (the corridor's sound before 18 Nov 2026, and its default).
auditoryElevationDeg:
  type: double
  unit: deg
  description: Elevation of the speaker that played; NaN when none played.
  note: NaN with auditoryAmplitude above 0 when every speaker played (initialAzimuthsDeg all).
