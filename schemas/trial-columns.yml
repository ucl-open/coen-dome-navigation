# What each BonsaiData_Trial column this workflow writes means (CreateTrialRow, src\Extensions\Corridor.cs, builds the row
# when the trial's outcome is known; scripts\check-workflow.ps1 holds the row's fields to this list). ExperimentManifest (TrialColumns) copies this file into every
# experiment's manifest.json at Start, so each experiment carries the meaning of its own trial log.
#
# Each column: type (int, double, bool or string), and where they apply values, unit, formerly
# (names it was recorded under before, newest first, Tom Childs' auditory-vr-corridor TrialLog
# names among them) and description. The names and types must
# also be on the lab's list (K:\config\data-dictionary.json, edited from rig-setup's Repos page):
# rig-control checks both before it launches the workflow.
#
# Naming: camelCase; a Harp time ends in Time and is in seconds; a quantity ends in its unit.
#
# Only what changes from trial to trial (Pip, 9 Nov 2026): the task file's values fixed for the
# experiment (the stage's row, toneAmplitude) are in Settings\Settings_Task_*.json and the stage itself
# is TrainingStage in Settings\Settings_Experiment_*.json; no column repeats another or sums the Harp logs (lickCount, trialStartWheelCm until 9 Nov 2026).
# With laser-off trials (zapit-v2) every trial of an optogenetics experiment has a condition, so laser on is
# laserPowerMw > 0, not laserCondition > 0 (laserPowerMw replaced optoStimulated, Pip, 9 Nov 2026).

Seconds:
  type: double
  unit: s
  formerly: [outcomeTime, HarpTime]
  description: Harp time the outcome was known (the trial's end), when the row was built; outcomeTime until 13 Nov 2026. Tom Childs' TrialLog was stamped 2 s later.
trialNumber:
  type: int
  formerly: [Trial]
  description: The trial's number in the experiment, from 1.
trialType:
  type: string
  values: [auditory, visual, audiovisual]
  formerly: [Modality]
  description: What the trial showed, in words, as av-dome's trialType - auditory (the tone sweep), visual (the grating) or both; the task file's modality.
outcome:
  type: string
  values: [Correct, Incorrect, NoResponse]
  formerly: [WasRewarded]
  description: The trial's result, in av-dome's values - Correct when rewarded, Incorrect at the wrong-lick limit, NoResponse at the time limit or the end of the track (endReason says which), or unrewarded on a stage without lickToReward. rig-control's Performance is Correct over Correct and Incorrect (NoResponse left out, its response rate shown beside it); Tom Childs' success rate was Correct over all trials.
endReason:
  type: string
  values: [FreqReached, CorrectLick, WrongLickLimit, Timeout, EndOfTrack]
  formerly: [EndReason]
  description: Why the trial ended - the reward frequency reached (on a stage without lickToReward, rows 0 and 1 of the task file, Tom Childs' stages 1 and 2), a lick in the reward zone, too many wrong licks, the trial's time limit, or the end of the track.
punishSound:
  type: bool
  formerly: [WasPunished]
  description: True when the error tone played (the task's punishment.sound enabled). A trial is punished when it runs out of time or track with the end frequency in the reward zone, and on a stage with punishWrongZone when it ends outside the zone (Corridor.cs CorridorState.End); the timeout follows.
punishTimeoutSeconds:
  type: double
  unit: s
  formerly: [WasPunished]
  description: The timeout after a punished trial (the task's punishment.timeoutSeconds), 0 when not punished.
trackLengthCm:
  type: double
  unit: cm
  formerly: [TrackLength]
  description: The trial's track length, one of trialStructure.trackLengthsCm, drawn per trial, times the stage's trackLengthScale. Distances are at rig.yml's wheelDiameterMm (75 mm on every dome).
endPositionCm:
  type: double
  unit: cm
  formerly: [TrialEndPosCm]
  description: Position along the track at the outcome (Seconds), behind the start never counted and capped at the track's length. Tom Childs' TrialEndPosCm was read 2 s later, so it included running after the outcome.
toneEndFrequencyHz:
  type: double
  unit: Hz
  formerly: [audioEndFrequencyHz, TrialEndAudFreq]
  description: The sweep's frequency when the trial ended.
visualEndSpatialFrequencyCpd:
  type: double
  unit: cycles/deg
  formerly: [TrialEndVisFreq]
  description: The grating's spatial frequency when the trial ended.
truncationFraction:
  type: double
  formerly: [TruncationPoint]
  description: Where the stimulus switched off, as a fraction of the sweep (one of truncation.sweepFractions, on the stage's truncatedTrialFraction of trials); 1 on an untruncated trial.
itiStartTime:
  type: double
  unit: s
  formerly: [ITIStartHarp]
  description: Harp time the inter-trial interval before this trial began - the last trial's outcome, after any punishment timeout; on trial 1 the first Harp clock tick after Go (NaN on trial 1 until 13 Nov 2026).
itiSeconds:
  type: double
  unit: s
  formerly: [ITIDrawnSec]
  description: The inter-trial interval drawn for this trial, evenly between trialStructure.itiMinSeconds and itiMaxSeconds, from itiStartTime (the last outcome, after any punishment timeout) to the first tone pip with a quiet mouse, the time to drink included; the stage's quiet waits add quietWaitSeconds, so the first pip came at itiStartTime + itiSeconds + quietWaitSeconds. From 13 Nov 2026 (Pip); before, it ran to the trial's start, NaN on trial 1, and quietSeconds was waited after it; earlier still it was drawn 0 to 1 s after a fixed 2 s; Tom Childs' workflow drew 0 or 1 s.
quietWaitSeconds:
  type: double
  unit: s
  description: How long the stage's quiet waits (lickQuietSeconds, wheelQuietSeconds and wheelQuietCm) held this trial's start (Go) past the end of its interval less the lead; 0 with the waits off or a quiet mouse. From 13 Nov 2026.
trialStartTime:
  type: double
  unit: s
  formerly: [TrialStartHarp]
  description: Harp time the trial started (Go, beep 0, position zero) - the end of its interval less the lead, max(laserToStimulusSeconds, 0), or later by quietWaitSeconds.
stimulusOnsetTime:
  type: double
  unit: s
  formerly: [CueOnsetHarp]
  description: Harp time the workflow commanded the stimulus on - the trial's first tone pip and grating frame, as Tom Childs' CueOnsetHarp. From 13 Nov 2026 it is the lead, max(laserToStimulusSeconds, 0) in the task file (in the manifest), after the trial's start in every experiment (beep 2 at 0.1 s); with optogenetics the trigger was laserToStimulusSeconds before it. Until 13 Nov 2026 it was beep 1 without optogenetics and laserToStimulusSeconds after beep 0 with it. The physical onset is in the hardware logs.
rewardSizeUl:
  type: double
  unit: ul
  description: Microlitres a reward on this trial gives (the stage's rewardSizeUl in trainingStages). What was delivered is RewardDelivered in BonsaiData_Async.
laserPowerMw:
  type: double
  unit: mW
  description: Laser power sent to Zapit for this trial (the task's optogenetics.laserPowerMw), as commanded, not measured. 0 on laser-off trials and without optogenetics.
laserCondition:
  type: int
  formerly: [optoCondition]
  description: The Zapit condition (stimLocations number, from 1) sent to Zapit this trial, laser on or off - every trial of an optogenetics experiment has one here, so laser on is laserPowerMw > 0, not laserCondition > 0. 0 without optogenetics.
