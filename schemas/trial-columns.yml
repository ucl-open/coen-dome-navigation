# What each WorkflowData_Trials column this workflow writes means. ExperimentManifest (TrialColumns) copies
# this file into every experiment's manifest.json at Start, so each experiment carries the meaning of its
# own trial log; open_rigs.trial_log reads it from there.
#
# Each column: type (int, double, bool or string), and where they apply values (the strings it may hold),
# unit, description (what it is), and note (this task's detail); copyOf, a task
# path (dotted) the column copies from the trial's Settings_Combinations row (else Settings_Task), and nanWhen {column,
# equals}, the rows where it is NaN instead, which open_rigs.trial_log checks on every load. The names and types must also be in the lab's
# Data Dictionary (K:\config\data-dictionary.json, edited on app-rig-control's Lab Names page): app-rig-control checks
# both before it launches the workflow.
#
# Naming: camelCase; a Harp time ends in Time and is in seconds; a duration or other quantity ends in its
# unit (itiSeconds, rewardOfferedUl); never a stored latency. Every distance is in track cm.
#
# The first 29 columns, harpTime to autoReward, are the lab's shared block, its core with the quietWait, optogenetics,
# conditions, stimulus and autoReward blocks, defined once in lib-open-rigs open_rigs.rigs.trials: coen-dome-decision-making and
# coen-dome-navigation list them in this order with these types, units and descriptions, word for word
# (tests/test_trial_columns.py holds both), so one analysis reads both tasks.
# trialType and outcome are described per task, and which trials are rewarded and penalised in those columns' notes. This task's own columns follow.
#
# Only what changes from trial to trial: a value fixed for the experiment (the session fields, the curriculum) is in
# Settings\Settings_Task_*.json, whose curriculum (code, version, path) is the stage, and the metric curriculumStage is its
# code-version; a condition-level value (a sound's level, the track's wheelGain) is in the trial's row of
# Settings\Settings_Combinations_*.json (trialCombinationId); no column sums the Harp logs, and none repeats another but
# outcomeTime, which names harpTime's moment so that the shared block names every moment of a trial.

harpTime:
  type: double
  unit: s
  description: Harp time the row was complete, when the outcome was known (outcomeTime). The lab's time column, first in every log (lib-open-rigs specs/logging.md, section 4); a trial's moments are read from their own columns.
trialNumber:
  type: int
  description: The trial's number in the experiment, from 1.
trialType:
  type: string
  values: [visual, auditory, audiovisualCoherent, neutral, visualTruncated, auditoryTruncated, audiovisualCoherentTruncated]
  description: The label of the trial's condition (trialConditionId), in coen-dome-decision-making's words - a name for the rows and analysis groups that drives nothing; what the trial showed is its own columns (visualInitialContrast, auditoryInitialLevelDbfs). Derived at Go from the condition's settings (the task's x-trial-types) - visual (the grating alone), auditory (the tone sweep alone), audiovisualCoherent (both) or neutral (neither); a condition whose stimulusCutoff.stimuli is not none takes Truncated after its name (visualTruncated, auditoryTruncated, audiovisualCoherentTruncated; neutral has no stimulus, so no truncated form).
outcome:
  type: string
  values: [correct, incorrect, noResponse, auto]
  description: The trial's result - correct when rewarded on a lick in the reward zone, auto when an auto-reward trial reached the zone (the auto-reward answered it, no response of the mouse's own needed; rewarded, outcomeReason rewardZoneReached), incorrect at the wrong-lick limit, noResponse at the end of the response window or of the track (outcomeReason says which). app-rig-control's Performance is correct over correct and incorrect (noResponse and auto left out, its response rate shown beside it); Tom Childs' success rate was correct over all trials.
itiStartTime:
  type: double
  unit: s
  description: 'Harp time the inter-trial interval before this trial began: the last trial''s trialEndTime (its outcomeTime in a log without trialEndTime) plus its penaltyTimeoutSeconds, exactly; on trial 1 the first Harp clock tick once the trials started.'
  note: Trial 1's interval starts at the first Harp clock tick once the experiment folder exists and the tones are loaded (OnNextTick).
itiSeconds:
  type: double
  unit: s
  description: 'The inter-trial interval drawn for this trial (every trial draws its own), uniformly between trialStructure.itiMinSeconds and itiMaxSeconds: from itiStartTime to this trial''s stimulus with a quiet mouse, the time to drink included. A task''s quiet waits add quietWaitSeconds, so the stimulus was due at itiStartTime + itiSeconds + quietWaitSeconds (stimulusOnsetTime).'
quietWaitSeconds:
  type: double
  unit: s
  description: How long the quiet waits (lickQuietSeconds, wheelQuietSeconds and wheelQuietCm; OpenRigs.Core QuietWait) held this trial's start past the end of its interval less the lead; 0 with the waits off or a quiet mouse.
trialStartTime:
  type: double
  unit: s
  description: 'Harp time the trial started: the end of its interval less the lead, max(laserToStimulusSeconds, -spouts.stimulusToSpoutsInSeconds unless spouts.alwaysIn, 0) in the task file (Settings_Task), each 0 for a task file without its block, plus quietWaitSeconds where the task has quiet waits.'
  note: Step 0, the track's position zero.
stimulusOnsetTime:
  type: double
  unit: s
  description: 'Harp time the workflow commanded the stimulus on, NaN if it never was: the first tick of the 1 ms Harp clock at or after trialStartTime plus the lead, in every experiment. The physical onset is in the hardware logs.'
  note: The trial's first tone pip and grating frame, as Tom Childs' CueOnsetHarp.
stimulusOffTime:
  type: double
  unit: s
  description: "Harp time the workflow commanded the stimulus off (OpenRigs.Trials StimulusTiming): the earlier of stimulusOnsetTime plus stimulus.durationSeconds and outcomeTime plus stimulus.responseToStimulusOffSeconds (unless null), at the first tick at or after it; known at the outcome, so logged in the row although it may come later. NaN if the stimulus never came on, or in a task whose stimulus the trial loop does not time. A task that ends it sooner itself says so (its note)."
  note: "Off at the outcome by default (stimulus.responseToStimulusOffSeconds 0); with a later off the tone and grating go on following the wheel and the auto-progress after the outcome, held at the track's end, until then. Earlier on a cutoff trial that leaves neither the tone nor the grating playing (stimulusCutoff, auditoryCutoffPositionCm and visualCutoffPositionCm): the 50 ms pip step at which neither played any more, so the row logs the earlier of the two."
outcomeTime:
  type: double
  unit: s
  description: Harp time the workflow knew the outcome, the same time as harpTime, as its own column so that every moment of a trial is named; the reward, the penalty sound and the timeout are timed from it. On a lick it is the Harp clock's latest tick when the workflow saw the lick, a few ms after it; each lick's own Harp time is in the lick detectors' logs.
  note: Why the trial ended is outcomeReason - a lick in the reward zone, the wrong-lick limit, the end of the response window, the end of the track or the reward zone reached.
rewardOfferedUl:
  type: double
  unit: ul
  description: 'Microlitres a reward on this trial gives, on every trial whether or not it was rewarded: the size the task drew for it (the task file''s reward size, or a larger reward where the task has one); 0 on a trial that offers none. rewarded says whether it was given; what was delivered is RewardDelivered in WorkflowData_Events.'
  note: The trial's condition's reward.sizeUl, or sizeUl x reward.largeMultiplier on a large-reward trial (drawn with reward.largeProbability), on every trial.
rewarded:
  type: bool
  description: 'True when the board answered the write that opened the valve for the trial''s reward (rewardOfferedUl; its RewardDelivered row in WorkflowData_Events, a few ms after outcomeTime); false on an outcome that earned it when the board had not answered by the next outcome. A stop before the board answered leaves the trial with no row. Which outcomes are rewarded is the task''s (its note).'
  note: A trial that ends on a lick in the reward zone (outcomeReason correctLick, outcome correct) or with the zone reached on an auto-reward trial (outcomeReason rewardZoneReached, outcome auto), rewarded at the left spout.
penaltyTimeoutSeconds:
  type: double
  unit: s
  description: 'The timeout after this trial when it was penalised, else 0: the trial''s penalty.incorrect.timeoutSeconds, or on a miss its penalty.noResponse.timeoutSeconds. The next interval starts after it (itiStartTime).'
penaltyFlashBrightness:
  type: double
  description: 'The brightness of the penalty flash after this trial when it was penalised, else 0: the trial''s penalty.incorrect.flash.brightness, or on a miss its penalty.noResponse.flash.brightness, 0 to 1 of the projector''s full white after gamma correction; 0 when no flash played. A flash covers the whole projector field at its kind''s flash.rateHz (white the first half of each cycle) from the outcome for the penalty sound''s length (OpenRigs.Vision PlayPenaltyFlash).'
penalised:
  type: bool
  description: 'True when the trial was penalised: the timeout (penaltyTimeoutSeconds) and the penalty sound at the trial''s penalty.incorrect.sound.levelDbfs, or on a miss its penalty.noResponse.sound.levelDbfs (none when mute), followed its outcome. Which trials are penalised, and which are misses, is the task''s (its note).'
  note: A trial that runs out of time or track with the outcome frequency in the reward zone, or ends outside the zone (TrialLogic.cs TrialRules.End).
laserCondition:
  type: int
  description: 'The Zapit condition sent to Zapit this trial (its conditions file''s number, from 1), laser on or off: every trial of an optogenetics experiment has one, so laser on is laserOn (drawn) or laserPowerMw > 0 (delivered), not laserCondition > 0. 0 without optogenetics.'
laserPointsMm:
  type: string
  unit: mm
  description: 'Where Zapit aimed the laser this trial: laserCondition''s points in the conditions file (Settings_ZapitConditions), in mm as written there, each point its AP then its ML separated by a space, points in the file''s order separated by ; (stimLocations01 with ML [1.5, -1.5] and AP [-0.7, -0.7] is -0.7 1.5;-0.7 -1.5). Filled whenever laserCondition is above 0, laser on or off (at 0 mW the galvos still move there); empty without optogenetics.'
laserPowerMw:
  type: double
  unit: mW
  description: 'Laser power delivered this trial, time-averaged per point: the Zapit bank''s power for the trial''s condition after the laser''s maximum and rig.yml''s zapit.ceilingMw (a peak) capped it (ZapitDaq''s Armed event''s cappedPowerMw; the task''s optogenetics.laserPowerMw on MATLAB Zapit), from calibration, not measured. Below the task''s power when the bank capped it (the Zapit event rows'' powerCapped). 0 on laser-off trials, without optogenetics, on a trial answered before its trigger, and on one ZapitDaq never started (laserStarted false: its trigger was missed, or LaserOff or a stop came first), unless its outcome came within 50 ms of the trigger, before Started could arrive (the Zapit event rows'' samples settle that case).'
laserTriggerTime:
  type: double
  unit: s
  description: 'Harp time the workflow raised the Zapit trigger line (the laser, or at 0 mW the galvos and masking light alone): the first tick of the 1 ms Harp clock at or after laserToStimulusSeconds before the stimulus was due. NaN without optogenetics and on a trial that ended before its trigger, so a laser-off trial (a time, laserPowerMw 0) and one answered first (NaN) differ.'
laserOn:
  type: bool
  description: 'True when the trial drew the laser on (laserOnProbability, once trialsBeforeLaser trials are past), whether or not it fired: a laser-off trial (false) is a control, its galvos and masking light played as on a laser trial. False without optogenetics.'
laserStarted:
  type: bool
  description: 'True when ZapitDaq reported the trial''s Started after its trigger by the outcome: its samples (laser, galvos and masking light) began. A laser trial or a control with laserStarted false did not play, unless its outcome came within 50 ms of the trigger, before Started could arrive (the Zapit event rows settle that case). A Started before the trigger stops the workflow. False without optogenetics and on MATLAB Zapit.'
trialConditionId:
  type: int
  description: The 0-based index of the trial's condition in trialConditions of the task file as run (Settings_Task), which gives its weight, pairs and condition-level values (set), from which its trialType is derived at Go. A repeat keeps the condition of the trial it repeats.
trialCombinationId:
  type: int
  description: 'The trial''s row in the experiment''s Settings_Combinations (0-based, session-wide): the combination it was drawn from, one pick of every list (pairs zipped), whose values that differ between combinations or from Settings_Task are the row''s values; the row''s trialConditionId and trialType are this trial''s. A repeat keeps the combination of the trial it repeats.'
visualInitialContrast:
  type: double
  description: Grating contrast as the trial starts, as BonVision's Contrast, 1 full contrast; 0 when no grating was shown.
  copyOf: visualStimulus.initialContrasts
visualPhaseRad:
  type: double
  unit: rad
  description: The grating's phase, drawn uniformly from 0 to 2 pi for every trial from the seeded stream (OpenRigs.Trials ConditionedTrial).
auditoryInitialLevelDbfs:
  type: double
  unit: dBFS
  description: The sound's level in dBFS RMS as the trial starts, the trial's auditoryStimulus.initialLevelDbfs; NaN when no sound played (mute).
  note: The trial's level even where a cutoff trial switched the tone off part way (auditoryCutoffPositionCm); each pip's own level, NaN once switched off, is WorkflowData_StimulusState's auditoryLevelDbfs.
  copyOf: auditoryStimulus.initialLevelDbfs
auditoryInitialAzimuthDeg:
  type: double
  unit: deg
  description: Azimuth of the speaker that played, rig.yml's nearest to the initial azimuth drawn; NaN when none played (auditoryInitialLevelDbfs NaN) or when every speaker played (auditoryStimulus.initialAzimuthsDeg all).
  note: The pips' one speaker, rig.yml's nearest (at auditoryStimulus.initialElevationDeg) to the azimuth picked from the condition's auditoryStimulus.initialAzimuthsDeg; NaN with a level when the pick was all, every speaker at once (the corridor's sound before 18 Nov 2026, and its default).
auditoryInitialElevationDeg:
  type: double
  unit: deg
  description: Elevation of the speaker that played as the trial starts; NaN when none or every speaker played, as auditoryInitialAzimuthDeg.
autoReward:
  type: bool
  description: 'True on an auto-reward trial (drawn with the task''s autoRewardProbability): one rewarded without a correct response, its outcome auto when the auto-reward answered it with no response of the mouse''s own; how, and so whether its reward came from the auto-reward, is the task''s (its note).'
  note: 'An auto-reward trial is rewarded on the pip whose tone reaches the reward zone''s floor, no lick needed, its licks ignored (outcomeReason rewardZoneReached, outcome auto): its reward came from the auto-reward when rewarded.'
outcomeReason:
  type: string
  values: [rewardZoneReached, correctLick, wrongLickLimit, responseWindowEnd, trackEnd]
  description: Why the trial ended - the reward zone reached (on an auto-reward trial, autoReward), a lick in the reward zone, too many wrong licks, the end of the response window (trialStructure.responseWindowSeconds after the first pip), or the end of the track.
trackLengthCm:
  type: double
  unit: cm
  description: The trial's track length in track cm, one of track.lengthsCm drawn per trial; the mouse runs trackLengthCm / track.wheelGain cm of wheel to its end (the trial's wheelGain is its Settings_Combinations row's). Distances are at rig.yml's wheelDiameterMm (75 mm on every dome).
  copyOf: track.lengthsCm
outcomePositionCm:
  type: double
  unit: cm
  description: 'Track cm run along the track at the outcome (outcomeTime): the wheel distance, behind the start never counted and capped at the track''s length, times the trial''s track.wheelGain. Tom Childs'' TrialEndPosCm was read 2 s later, so it included running after the outcome.'
auditoryOutcomeFrequencyHz:
  type: double
  unit: Hz
  description: The tone sweep's frequency at the outcome (outcomeTime).
visualOutcomeSpatialFrequencyCpd:
  type: double
  unit: cycles/deg
  description: The grating's spatial frequency at the outcome (outcomeTime).
auditoryCutoffPositionCm:
  type: double
  unit: cm
  description: Position along the track, in track cm, where the tone switched off on a cutoff trial (its condition's stimulusCutoff.stimuli auditory or both, at one of stimulusCutoff.trackFractions of the track); NaN when it never did.
visualCutoffPositionCm:
  type: double
  unit: cm
  description: Position along the track, in track cm, where the grating switched off on a cutoff trial (its condition's stimulusCutoff.stimuli visual or both, at one of stimulusCutoff.trackFractions of the track); NaN when it never did.
