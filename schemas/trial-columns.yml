# What each BonsaiData_Trial column this workflow writes means (the TrialRow group builds the row
# when the trial's outcome is known, TrialOutcome). ExperimentManifest (TrialColumns) copies this file into every
# experiment's manifest.json at Start, so each experiment carries the meaning of its own trial log.
#
# Each column: type (int, double, bool or string), and where they apply values, unit, formerly
# (names it was recorded under before, newest first, Tom Childs' auditory-vr-corridor TrialLog
# names among them) and description. The names and types must
# also be on the lab's list (K:\config\data-dictionary.json, edited from rig-setup's Repos page):
# rig-control checks both before it launches the workflow.
#
# Naming: camelCase; a Harp time ends in Time and is in seconds; a quantity ends in its unit.
#
# Only what changes from trial to trial (Pip, 9 Nov 2026): the task file's values fixed for the
# experiment (the stage's row, toneAmplitude) are in Settings\Settings_Task_*.json and the stage itself
# is TrainingStage in Settings\Settings_Experiment_*.json; no column repeats another or sums the Harp logs (lickCount, trialStartWheelCm until 9 Nov 2026).
# With laser-off trials (zapit-v2) every trial of an optogenetics experiment has a condition, so laser on is
# laserPowerMw > 0, not laserCondition > 0 (laserPowerMw replaced optoStimulated, Pip, 9 Nov 2026).

Seconds:
  type: double
  unit: s
  formerly: [HarpTime]
  description: Harp time the row was built, when the outcome was known - after the reward tone on a reward, after the error tone and timeout on a punishment, at once otherwise. Tom Childs' TrialLog was stamped 2 s later.
trialNumber:
  type: int
  formerly: [Trial]
  description: The trial's number in the experiment, from 1.
trialType:
  type: string
  values: [auditory, visual, audiovisual]
  formerly: [Modality]
  description: What the trial showed, in words, as av-dome's trialType - auditory (the tone sweep), visual (the grating) or both; the task file's modality.
outcome:
  type: string
  values: [Correct, Incorrect, NoResponse]
  formerly: [WasRewarded]
  description: The trial's result, in av-dome's values - Correct when rewarded, Incorrect at the wrong-lick limit, NoResponse at the time limit or the end of the track (endReason says which), or unrewarded on a stage without lickToReward. rig-control's performance is Correct over all trials, Tom Childs' success rate.
endReason:
  type: string
  values: [FreqReached, CorrectLick, WrongLickLimit, Timeout, EndOfTrack]
  formerly: [EndReason]
  description: Why the trial ended - the reward frequency reached (stages 1-2), a lick in the reward zone, too many wrong licks, the trial's time limit, or the end of the track.
punishSound:
  type: bool
  formerly: [WasPunished]
  description: True when the error tone played (the task's punishment.sound enabled). A trial is punished when it runs out of time or track with the end frequency in the reward zone, and on a stage with punishWrongZone when it ends outside the zone (ProcessTrialEnd); the timeout follows.
punishTimeoutSeconds:
  type: double
  unit: s
  formerly: [WasPunished]
  description: The timeout after a punished trial (the task's punishment.timeoutSeconds), 0 when not punished.
trackLengthCm:
  type: double
  unit: cm
  formerly: [TrackLength]
  description: The trial's track length, one of trialStructure.trackLengthsCm, drawn per trial, times the stage's trackLengthScale. Distances are at the task file's wheelDiameterMm.
endPositionCm:
  type: double
  unit: cm
  formerly: [TrialEndPosCm]
  description: Distance run in the trial when the row was built (Seconds). Tom Childs' TrialEndPosCm was read 2 s later, so it included running after the outcome.
toneEndFrequencyHz:
  type: double
  unit: Hz
  formerly: [audioEndFrequencyHz, TrialEndAudFreq]
  description: The sweep's frequency when the trial ended.
visualEndSpatialFrequencyCpd:
  type: double
  unit: cycles/deg
  formerly: [TrialEndVisFreq]
  description: The grating's spatial frequency when the trial ended.
truncationFraction:
  type: double
  formerly: [TruncationPoint]
  description: Where the stimulus switched off, as a fraction of the sweep (one of truncation.sweepFractions, on the stage's truncatedTrialFraction of trials); 1 on an untruncated trial.
itiStartTime:
  type: double
  unit: s
  formerly: [ITIStartHarp]
  description: Harp time the inter-trial interval before this trial began.
itiSeconds:
  type: double
  unit: s
  formerly: [ITIDrawnSec]
  description: The inter-trial interval drawn before this trial, evenly between trialStructure.itiMinSeconds and itiMaxSeconds (Tom Childs' workflow drew 0 or 1 s until 9 Nov 2026). On a stage with quiescent the trial also waited for quiescentSeconds without licks.
trialStartTime:
  type: double
  unit: s
  formerly: [TrialStartHarp]
  description: Harp time the trial started (position zero).
stimulusOnsetTime:
  type: double
  unit: s
  formerly: [CueOnsetHarp]
  description: Harp time the workflow commanded the stimulus on - the trial's first tone pip and grating frame (beep 1, 50 ms after the trial's start at beep 0), as Tom Childs' CueOnsetHarp. In an optogenetics experiment the laser comes on laserToStimulusSeconds before it. The physical onset is in the hardware logs.
outcomeTime:
  type: double
  unit: s
  formerly: [OutcomeHarp]
  description: Harp time of the outcome (reward, punishment or end).
rewardSizeUl:
  type: double
  unit: ul
  description: Microlitres a reward on this trial gives (the stage's rewardSizeUl in trainingStages). What was delivered is RewardDelivered in BonsaiData_Async.
laserPowerMw:
  type: double
  unit: mW
  description: Laser power sent to Zapit for this trial (the task's optogenetics.laserPowerMw), as commanded, not measured. 0 on laser-off trials and without optogenetics.
laserCondition:
  type: int
  formerly: [optoCondition]
  description: The Zapit condition (stimLocations number, from 1) sent to Zapit this trial, laser on or off - every trial of an optogenetics experiment has one here, so laser on is laserPowerMw > 0, not laserCondition > 0. 0 without optogenetics.
