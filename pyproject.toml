[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "ucl-open-coen-dome-navigation"
description = "The coen-dome-navigation experiment's task schema and waveforms."
authors = [ {name = "Tom Childs", email = "thomas.childs.19@ucl.ac.uk"}]
license = "BSD-3-Clause"
requires-python = ">=3.11, <3.12"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
version = "0.0.0-rc1"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
  "open-rigs",
  "numpy",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest",
    "pyyaml>=6.0.3",
]

[project.scripts]
regenerate-schemas = "ucl_open_coen_dome_navigation.regenerate:main"
generate-waveforms = "ucl_open_coen_dome_navigation.waveforms:main"
summarise-experiment = "open_rigs.rigs.trials:main"

# The model app-rig-control runs on each task field edit and at Launch (open_rigs.rigs.check_task).
[project.entry-points."open_rigs.task"]
parameters = "ucl_open_coen_dome_navigation.task:UclOpenCoenDomeNavigationTaskParameters"

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'

[tool.uv]
required-version = '>=0.8.4'

[tool.uv.sources]
# The lab's fork, at the same commit as coen-dome-decision-making: both workflows read the same
# rig.yml, so their rig models must come from the same open-rigs. lib-open-rigs' update-workflows moves this pin.
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "a820afb10fc81799b9b9e133d940931c94fa5651"}
