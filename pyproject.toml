[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "ucl-open-coen-dome-navigation"
description = "The coen-dome-navigation experiment's rig and task schemas, waveforms and shaping-stage choice."
authors = [ {name = "Tom Childs", email = "thomas.childs.19@ucl.ac.uk"}]
license = "MIT"
requires-python = ">=3.11, <3.12"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
# Kept equal to av-dome's: the rig model's version field is this package's version, and every
# rig.yml is read by both workflows.
version = "0.0.0-rc1"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
  "swc-aeon>=0.2.0",
  "open-rigs",
  "pydantic-settings",
  "numpy",
  "scipy",
  "pyyaml",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest",
]

[project.scripts]
regenerate-schemas = "ucl_open_coen_dome_navigation.regenerate:main"
generate-waveforms = "ucl_open_coen_dome_navigation.waveforms:main"
suggest-stage = "ucl_open_coen_dome_navigation.stage:main"

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'

[tool.uv]
required-version = '>=0.8.4'

[tool.uv.sources]
# The lab's fork, at av-dome's commit: both workflows read the same rig.yml, so their rig models
# must come from the same open-rigs. lib-open-rigs' update-workflows moves this pin.
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "d5ccaed6c821ad36e49edabd21b410a64d298258"}
swc-aeon = { git = "https://github.com/SainsburyWellcomeCentre/aeon_api.git", branch = "main" }
